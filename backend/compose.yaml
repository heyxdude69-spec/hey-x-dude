services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      MONGODB_URI: mongodb://mongo:27017/video_catalog_mongo
      REDIS_URL: redis://redis:6379
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
      PROVIDER_HOSTS_JSON: ${PROVIDER_HOSTS_JSON:-{"voe":["voe.sx"],"filemoon":[],"playmate":[],"direct":["interactive-examples.mdn.mozilla.net"],"reference":[]}}
      TRUST_PROXY_HOPS: 1
    volumes: ["sitemaps:/app/public/sitemaps"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "scripts/catalog_worker.mjs"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/video_catalog_mongo
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      PROVIDER_HOSTS_JSON: ${PROVIDER_HOSTS_JSON:-{"voe":["voe.sx"],"filemoon":[],"playmate":[],"direct":["interactive-examples.mdn.mozilla.net"],"reference":[]}}
    volumes: ["sitemaps:/app/public/sitemaps"]
    depends_on:
      api: { condition: service_healthy }
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_cache:/var/cache/nginx/catalog
    depends_on:
      api: { condition: service_healthy }
volumes:
  mongo_data:
  sitemaps:
  proxy_cache:
