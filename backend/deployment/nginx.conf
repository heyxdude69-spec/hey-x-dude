events { worker_connections 2048; }
http {
    resolver 127.0.0.11 valid=10s;
    proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:16m max_size=512m inactive=5m;
    upstream catalog_backend {
        zone catalog_backend 64k;
        server api:3000 resolve;
        keepalive 32;
    }
    server {
        listen 80;
        client_max_body_size 160k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /api/admin/ {
            proxy_pass http://catalog_backend;
            proxy_cache off;
        }
        location /health/ {
            proxy_pass http://catalog_backend;
            proxy_cache off;
        }
        location / {
            proxy_pass http://catalog_backend;
            proxy_cache catalog;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_cache_valid 200 15s;
            proxy_cache_lock on;
            proxy_cache_use_stale off;
            add_header X-Edge-Cache $upstream_cache_status;
        }
    }
}
